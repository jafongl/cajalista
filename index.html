<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi App</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family:Arial, sans-serif;
      background:#f3f4f6;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:16px;
      width:320px;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#065f46;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:12px;
      border:1px solid #d1d5db;
      border-radius:10px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#065f46;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    .secondary{
      margin-top:10px;
      background:#e5e7eb;
      color:#111827;
    }

    .error{
      margin-top:10px;
      color:red;
      font-size:14px;
      text-align:center;
    }

    .forgot{
      text-align:center;
      margin-top:10px;
    }

    .forgot a{
      font-size:13px;
      color:#065f46;
      text-decoration:none;
    }

    .forgot a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

  <div class="card">

    <h1>Mi App</h1>

    <input type="email" id="a-email" placeholder="Correo" />
    <input type="password" id="a-pass" placeholder="Contraseña" />

    <button onclick="doAuth('login')">Entrar</button>

    <button class="secondary" onclick="doAuth('signup')">
      Crear cuenta
    </button>

    <div class="forgot">
      <a href="#" onclick="forgotPassword()">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <div id="a-err" class="error"></div>

  </div>

  <script>

    // ============================================
    // CONFIGURA ESTO CON TUS DATOS DE SUPABASE
    // ============================================

    const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';

    const SUPABASE_ANON_KEY = 'TU-ANON-KEY';

    // ============================================

    const SB = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // ============================================
    // LOGIN / SIGNUP
    // ============================================

    async function doAuth(mode){

      const email = document
        .getElementById('a-email')
        .value
        .trim();

      const password = document
        .getElementById('a-pass')
        .value
        .trim();

      const errEl = document.getElementById('a-err');

      errEl.textContent = '';

      if(!email || !password){
        errEl.textContent = 'Completa todos los campos.';
        return;
      }

      let result;

      if(mode === 'login'){

        result = await SB.auth.signInWithPassword({
          email,
          password
        });

      } else {

        result = await SB.auth.signUp({
          email,
          password
        });

      }

      if(result.error){

        errEl.textContent = result.error.message;

      } else {

        if(mode === 'signup'){

          errEl.textContent =
            'Cuenta creada. Revisa tu correo.';

        } else {

          alert('Login exitoso');

          // CAMBIA ESTO SI QUIERES REDIRIGIR
          // window.location.href = 'dashboard.html';

        }
      }
    }

    // ============================================
    // RECUPERAR CONTRASEÑA
    // ============================================

    async function forgotPassword(){

      const email = document
        .getElementById('a-email')
        .value
        .trim();

      const errEl = document.getElementById('a-err');

      if(!email){

        errEl.textContent =
          'Escribe tu correo primero.';

        return;
      }

      errEl.textContent = 'Enviando correo...';

      const { error } =
        await SB.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin
        });

      if(error){

        errEl.textContent = error.message;

      } else {

        errEl.textContent =
          'Revisa tu correo para cambiar la contraseña.';
      }
    }

    // ============================================
    // DETECTAR RECUPERACIÓN DE CONTRASEÑA
    // ============================================

    SB.auth.onAuthStateChange(async (event, session) => {

      if(event === 'PASSWORD_RECOVERY'){

        const newPassword = prompt(
          'Escribe tu nueva contraseña'
        );

        if(!newPassword || newPassword.length < 6){

          alert(
            'La contraseña debe tener mínimo 6 caracteres'
          );

          return;
        }

        const { error } =
          await SB.auth.updateUser({
            password: newPassword
          });

        if(error){

          alert(error.message);

        } else {

          alert(
            'Contraseña actualizada correctamente'
          );

          window.location.href = window.location.origin;
        }
      }
    });

    // ============================================
    // VERIFICAR SESIÓN
    // ============================================

    (async () => {

      const {
        data: { session }
      } = await SB.auth.getSession();

      if(session){

        console.log('Usuario logueado');

      } else {

        console.log('No hay sesión');

      }

    })();

  </script>

</body>
</html>
